<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دمية حلم الفراولة — عارض ثلاثي الأبعاد</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff7fb;
      background: radial-gradient(ellipse at 50% 35%, #542b43 0, #241624 48%, #100d16 100%);
    }

    main {
      width: min(100%, 1080px);
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 0 4px 14px;
    }

    h1 {
      font-size: clamp(1.25rem, 3vw, 2rem);
      margin: 0;
    }

    p {
      margin: 6px 0 0;
      color: #d9c7d3;
      font-size: 0.95rem;
    }

    .viewer {
      position: relative;
      overflow: hidden;
      height: min(72vh, 760px);
      min-height: 420px;
      border: 1px solid #ffffff20;
      border-radius: 24px;
      background: radial-gradient(ellipse at 50% 45%, #fff0f322 0, #271b2c 58%, #17121d 100%);
      box-shadow: 0 24px 80px #0008;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      --progress-bar-color: #ff8ab6;
    }

    .controls {
      position: absolute;
      inset: auto 16px 16px;
      display: flex;
      gap: 10px;
      pointer-events: none;
    }

    button {
      pointer-events: auto;
      border: 1px solid #ffffff30;
      border-radius: 999px;
      padding: 10px 16px;
      color: white;
      background: #18131dcf;
      backdrop-filter: blur(10px);
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #3a2437;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #f6dce9;
      text-align: center;
      pointer-events: none;
    }

    .loading[hidden] {
      display: none;
    }

    .hint {
      margin: 12px 4px 0;
      color: #cdbbc9;
      font-size: 0.86rem;
    }

    @media (max-width: 600px) {
      body {
        padding: 14px;
      }

      .viewer {
        min-height: 64vh;
        border-radius: 18px;
      }

      header {
        display: block;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>دمية حلم الفراولة</h1>
        <p>عارض تفاعلي للنموذج ثلاثي الأبعاد</p>
      </div>
    </header>

    <section class="viewer" aria-label="عارض النموذج ثلاثي الأبعاد">
      <model-viewer
        id="model"
        src="Strawberry_Dream_Doll_Meshy_AI_2026-11-08_7fd157_1794163839763.glb"
        alt="نموذج دمية حلم الفراولة ثلاثي الأبعاد"
        camera-controls
        auto-rotate
        auto-rotate-delay="1800"
        rotation-per-second="22deg"
        touch-action="pan-y"
        shadow-intensity="1"
        exposure="1"
        environment-image="neutral"
        interaction-prompt="auto">
      </model-viewer>

      <div class="loading" id="loading">جارٍ تحميل النموذج…</div>

      <div class="controls">
        <button type="button" id="rotateButton">إيقاف الدوران</button>
        <button type="button" id="resetButton">إعادة ضبط العرض</button>
      </div>
    </section>

    <p class="hint">اسحب لتدوير النموذج، واستخدم عجلة الماوس أو القرص للتكبير والتصغير.</p>
  </main>

  <script>
    const viewer = document.querySelector("#model");
    const loading = document.querySelector("#loading");
    const rotateButton = document.querySelector("#rotateButton");

    viewer.addEventListener("load", () => {
      loading.hidden = true;
    });

    viewer.addEventListener("error", () => {
      loading.hidden = false;
      loading.textContent = "تعذّر تحميل النموذج. تأكد من وجود ملف GLB بجانب صفحة HTML.";
    });

    rotateButton.addEventListener("click", () => {
      viewer.toggleAttribute("auto-rotate");
      rotateButton.textContent = viewer.hasAttribute("auto-rotate")
        ? "إيقاف الدوران"
        : "تشغيل الدوران";
    });

    document.querySelector("#resetButton").addEventListener("click", () => {
      viewer.cameraOrbit = "0deg 75deg 105%";
      viewer.cameraTarget = "auto";
    });
  </script>
</body>
</html>
