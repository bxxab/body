<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastel Strawberry Dream - 3D Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; }
    #info { position: absolute; top: 10px; width: 100%; text-align: center; color: white; z-index: 10; }
  </style>
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- GLTFLoader -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="info">
    <h2>Pastel Strawberry Dream</h2>
    <p>استخدم الماوس للتدوير، التكبير، والتحريك</p>
  </div>

  <script>
    // 1. الإعدادات الأساسية والمشهد (Scene & Camera)
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0e6ef);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 2. التفاعل والتحكم (Controls)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 3. الإضاءة (Lighting)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    // 4. تحميل مجسم 3D (استبدل الرابط برابط ملف glTF/glb الخاص بك)
    const loader = new THREE.GLTFLoader();
    /*
    loader.load('path/to/model.glb', (gltf) => {
      scene.add(gltf.scene);
    });
    */

    // مجسم توضيحي (Cube مؤقت)
    const geometry = new THREE.BoxGeometry();
    const material = new THREE.MeshStandardMaterial({ color: 0xffb7c5 });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);

    // 5. الحلقة البرمجية للتحريك (Animation Loop)
    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.y += 0.01;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // ضبط الحجم عند تغيير حجم الشاشة
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
